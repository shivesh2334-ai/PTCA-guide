<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post-PTCA Recovery Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  :root{
    --paper:#F5F7F5;
    --card:#FFFFFF;
    --ink:#16232B;
    --ink-soft:#4B5B62;
    --teal:#1F6F5C;
    --teal-light:#E4F0EB;
    --teal-line:#BFDAD0;
    --amber:#A9662A;
    --amber-light:#F7ECDD;
    --coral:#B9402A;
    --coral-light:#FBEAE6;
    --slate:#3D5A73;
    --slate-light:#E9EEF2;
    --line:#DCE3E0;
    --shadow: 0 1px 2px rgba(22,35,43,0.04), 0 8px 24px -12px rgba(22,35,43,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Gurmukhi",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3,.serif{
    font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;
    font-weight:700;
    margin:0;
  }
  .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:500;
  }
  a{color:var(--slate);}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--slate);outline-offset:2px;}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(245,247,245,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;flex:none;
  }
  .brand-name{font-size:14px;font-weight:700;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;line-height:1.15;}
  .brand-sub{font-size:10.5px;color:var(--ink-soft);}
  .langswitch{display:flex;background:var(--slate-light);border-radius:999px;padding:3px;gap:2px;}
  .langswitch button{
    border:none;background:transparent;color:var(--slate);
    font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;
    transition:background .15s,color .15s;
  }
  .langswitch button.active{background:var(--slate);color:#fff;}

  /* ---- Hero ---- */
  .hero{max-width:920px;margin:0 auto;padding:40px 20px 8px;}
  .hero h1{font-size:clamp(26px,4.4vw,38px);letter-spacing:-0.01em;color:var(--ink);}
  .hero p.tagline{margin-top:10px;font-size:15.5px;color:var(--ink-soft);max-width:60ch;}

  /* ---- Pulse timeline signature ---- */
  .pulse-wrap{max-width:920px;margin:26px auto 6px;padding:0 20px;}
  .pulse-rail{
    position:relative;
    background:linear-gradient(180deg,var(--card),var(--card));
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 18px 16px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .pulse-svg{width:100%;height:46px;display:block;}
  .pulse-stages{
    display:grid;grid-template-columns:repeat(5,1fr);
    margin-top:6px;
  }
  .pulse-stage{text-align:center;font-size:11.5px;color:var(--ink-soft);font-weight:600;padding-top:4px;}
  .pulse-stage .dot{
    width:8px;height:8px;border-radius:50%;background:var(--teal);
    margin:0 auto 6px;
  }

  /* ---- Red flag banner ---- */
  .redflag{
    max-width:920px;margin:22px auto 0;padding:0 20px;
  }
  .redflag-inner{
    background:var(--coral-light);
    border:1px solid #EBC4BA;
    border-radius:14px;
    padding:14px 16px;
    display:flex;gap:12px;align-items:flex-start;
  }
  .redflag-inner svg{flex:none;margin-top:2px;color:var(--coral);}
  .redflag-title{font-weight:700;color:var(--coral);font-size:13.5px;margin-bottom:3px;}
  .redflag-text{font-size:13.5px;color:#5c2a1d;}

  /* ---- Section grid ---- */
  .sections{max-width:920px;margin:32px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:16px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .card-head{
    display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .card-icon{
    width:38px;height:38px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--teal-light);color:var(--teal);
  }
  .card-title{font-size:17px;font-weight:700;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;flex:1;}
  .card-chevron{transition:transform .18s;color:var(--ink-soft);flex:none;}
  .card.open .card-chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .card.open .card-body{max-height:2000px;}
  .card-body-inner{padding:0 18px 18px;border-top:1px solid var(--line);}
  .stage-row{
    display:grid;grid-template-columns:96px 1fr;gap:14px;
    padding:14px 0;border-bottom:1px dashed var(--line);
    position:relative;
  }
  .stage-row:last-child{border-bottom:none;}
  .stage-label{
    font-size:12px;font-weight:700;color:var(--teal);
    position:relative;padding-left:16px;
  }
  .stage-label::before{
    content:"";position:absolute;left:0;top:4px;width:8px;height:8px;border-radius:50%;background:var(--teal);
  }
  .stage-text{font-size:14.5px;color:var(--ink);}
  .stage-text b{color:var(--ink);}
  .note-chip{
    display:inline-block;margin-top:10px;font-size:12.5px;background:var(--amber-light);
    color:var(--amber);border:1px solid #E9CFA9;padding:6px 10px;border-radius:8px;
  }

  /* ---- Footer ---- */
  .footer{max-width:920px;margin:36px auto 120px;padding:0 20px;font-size:12px;color:var(--ink-soft);}
  .footer .sources{margin-top:6px;}

  /* ---- Chat ---- */
  .chat-fab{
    position:fixed;right:20px;bottom:20px;z-index:50;
    background:var(--ink);color:#fff;border:none;border-radius:999px;
    padding:14px 18px;display:flex;align-items:center;gap:9px;
    box-shadow:0 10px 30px -8px rgba(22,35,43,0.45);
    font-size:14px;font-weight:600;
  }
  .chat-panel{
    position:fixed;right:20px;bottom:20px;z-index:60;
    width:380px;max-width:92vw;height:min(560px,78vh);
    background:var(--card);border-radius:18px;border:1px solid var(--line);
    box-shadow:0 20px 60px -12px rgba(22,35,43,0.4);
    display:none;flex-direction:column;overflow:hidden;
  }
  .chat-panel.open{display:flex;}
  .chat-head{
    background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
  }
  .chat-head-title{font-size:14px;font-weight:700;flex:1;font-family:"Noto Serif","Noto Serif Devanagari","Noto Serif Bengali","Noto Serif Gurmukhi",serif;}
  .chat-head-sub{font-size:11px;opacity:.7;}
  .chat-close{background:transparent;border:none;color:#fff;opacity:.8;padding:4px;}
  .chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper);}
  .msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;}
  .msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .msg.typing{background:#fff;border:1px solid var(--line);align-self:flex-start;color:var(--ink-soft);font-style:italic;}
  .chat-input-row{
    border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;background:#fff;
  }
  .chat-input-row input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;
    background:var(--paper);color:var(--ink);
  }
  .chat-input-row button{
    background:var(--teal);color:#fff;border:none;border-radius:10px;padding:0 14px;font-weight:600;font-size:13px;
  }
  .chat-input-row button:disabled{opacity:.5;}
  .chat-disclaimer{font-size:10.5px;color:var(--ink-soft);padding:6px 14px 10px;background:#fff;}
  .voice-toggle{background:transparent;border:none;color:#fff;opacity:.8;padding:4px;display:flex;align-items:center;}
  .voice-toggle.muted{opacity:.4;}
  .msg-speak{background:transparent;border:none;color:var(--ink-soft);opacity:.7;padding:2px 0 0;align-self:flex-start;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:4px;}

  @media (max-width:520px){
    .stage-row{grid-template-columns:1fr;gap:4px;}
    .pulse-stage{font-size:9.5px;}
    .chat-panel{right:10px;left:10px;width:auto;bottom:10px;height:74vh;}
    .chat-fab{right:16px;bottom:16px;padding:12px 16px;}
  }
</style>
</head>

<div class="redflag">

      <div class="redflag-title" id="redflagTitle"></div>

<script>
/* =========================================================
   CONTENT — English source, then hi / pa / bn translations
   ========================================================= */
const STAGE_AXIS = ["Day 1–2","Week 1","Week 2","Week 4","Week 6"];
const STAGE_AXIS_HI = ["दिन 1–2","सप्ताह 1","सप्ताह 2","सप्ताह 4","सप्ताह 6"];

const STAGE_AXIS_BN = ["দিন ১–২","সপ্তাহ ১","সপ্তাহ ২","সপ্তাহ ৪","সপ্তাহ ৬"];

const ICONS = {
  driving:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M3 13l1.6-4.8A2 2 0 0 1 6.5 7h11a2 2 0 0 1 1.9 1.2L21 13M3 13v5a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h12v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-5M3 13h18M7 17h.01M17 17h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  flying:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M10.5 21 12 17l1.5 4M2 12l20-7-4 8M2 12l6.5-1.8M2 12l6.5 4.2M18 13 8.2 10.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',

const DATA = {
en:{
  dir:"ltr",
  brandName:"Post-PTCA Recovery Guide", brandSub:"EasyMyCare Clinic",
  eyebrow:"DAILY LIFE AFTER ANGIOPLASTY",
  heroTitle:"Getting back to normal life after your angioplasty",
  heroTag:"Simple, guideline-based answers on driving, flying, intimacy, work and exercise after a coronary stent — based on ESC, ACC/AHA and Indian cardiology society practice recommendations.",

  footerNote:"This guide summarises general post-PCI (angioplasty/stent) lifestyle recommendations from ESC, ACC/AHA and Indian cardiology society practice guidance. It is educational material and does not replace individual advice from your treating cardiologist — recovery timelines vary with the complexity of your procedure, heart function, access site (radial/femoral) and any complications.",
  footerSources:"References: ESC Guidelines on Myocardial Revascularisation & Fitness to Drive; ESC Guidelines for Chronic Coronary Syndromes (2024); 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Acute Coronary Syndromes; 2021 ACC/AHA/SCAI Guideline for Coronary Artery Revascularisation; Levine GN et al, \"Sexual Activity and Cardiovascular Disease: A Scientific Statement From the American Heart Association,\" Circulation 2012;125:1058–1072; Cardiological Society of India practice advisories. Content last reviewed against published literature: August 2026.",
  sections:[
    {key:"driving", title:"Driving", items:[

      {stage:"Day 1–2", text:"Gentle indoor walking as tolerated. Avoid lifting or straining the puncture-site arm/leg."},
      {stage:"Week 1", text:"Short daily walks (10–15 minutes), gradually increasing."},
      {stage:"Week 2", text:"Increase walking duration; light stationary cycling. Avoid swimming until the access site is fully healed."},
      {stage:"Week 2–4", text:"Begin a structured cardiac rehabilitation exercise programme if enrolled."},
      {stage:"Week 4–6", text:"Light gym work / resistance training with light weights, guided by your rehab team."},
      {stage:"After clearance", text:"Heavy weightlifting, competitive sport or high-intensity training only after cardiologist clearance, usually confirmed with a treadmill/stress test around 6 weeks."}
    ], note:"Regular moderate activity, not intense bursts, is what protects your heart long-term."},
    {key:"meds", title:"Medicines after your stent", items:[
      {stage:"Dual antiplatelet therapy (DAPT)", text:"Continue aspirin plus a P2Y12 inhibitor (ticagrelor, prasugrel or clopidogrel) exactly as prescribed — commonly for about <b>12 months</b> after a stent placed for a heart attack/ACS."},
      {stage:"2025 update", text:"The 2025 ACC/AHA ACS guideline now allows some higher bleeding-risk patients to stop aspirin after just <b>1 month</b> and continue on a single antiplatelet (often ticagrelor) alone — this is an individualised decision your cardiologist makes, not a self-directed change."},
      {stage:"Never self-stop", text:"Stopping antiplatelet medicines suddenly on your own sharply raises the risk of the stent blocking (stent thrombosis), which can cause a heart attack."},
      {stage:"Before any other procedure", text:"Tell any other doctor, surgeon or dentist that you are on antiplatelet therapy before any planned procedure — do not stop it for that procedure without your cardiologist's specific instruction."}
    ], note:"This section reflects the 2025 ACC/AHA/ACEP/NAEMSP/SCAI ACS Guideline update on antiplatelet duration."}
  ]
},

  chatDisclaimer:"यह चैटबॉट केवल सामान्य जीवनशैली संबंधी जानकारी देता है और आपके अपने कार्डियोलॉजिस्ट की सलाह का विकल्प नहीं है। आपात स्थिति में तुरंत अपने स्थानीय आपातकालीन नंबर पर कॉल करें।",
  footerNote:"यह गाइड ESC, ACC/AHA और भारतीय कार्डियोलॉजी सोसाइटी की सामान्य पोस्ट-पीसीआई (एंजियोप्लास्टी/स्टेंट) जीवनशैली सिफारिशों का सारांश है। यह केवल शैक्षणिक जानकारी है और आपके इलाज करने वाले कार्डियोलॉजिस्ट की व्यक्तिगत सलाह का स्थान नहीं ले सकती — रिकवरी का समय आपकी प्रक्रिया की जटिलता, हृदय की कार्यक्षमता, एक्सेस साइट (रेडियल/फीमोरल) और किसी भी जटिलता पर निर्भर करता है।",
  footerSources:"संदर्भ: ESC मायोकार्डियल रिवास्कुलराइज़ेशन एवं ड्राइविंग फिटनेस दिशानिर्देश; ESC क्रॉनिक कोरोनरी सिंड्रोम दिशानिर्देश (2024); 2025 ACC/AHA/ACEP/NAEMSP/SCAI एक्यूट कोरोनरी सिंड्रोम प्रबंधन दिशानिर्देश; 2021 ACC/AHA/SCAI कोरोनरी आर्टरी रिवास्कुलराइज़ेशन दिशानिर्देश; Levine GN एवं अन्य, \"Sexual Activity and Cardiovascular Disease: A Scientific Statement From the American Heart Association,\" Circulation 2012;125:1058–1072; कार्डियोलॉजिकल सोसाइटी ऑफ इंडिया की व्यावहारिक सलाह। सामग्री की अंतिम समीक्षा: अगस्त 2026।",
  sections:[
    {key:"driving", title:"ड्राइविंग", items:[
      {stage:"पहले 48 घंटे", text:"गाड़ी न चलाएं। सेडेशन का असर, प्रतिक्रिया क्षमता में कमी, और कलाई/ग्रोइन पंक्चर साइट के कारण यह असुरक्षित है।"},
      {stage:"सामान्य, योजनाबद्ध पीसीआई", text:"निजी कार चलाना आमतौर पर <b>1 सप्ताह</b> बाद शुरू किया जा सकता है, जब आप स्वस्थ महसूस करें और पंक्चर वाले अंग को सामान्य रूप से हिला सकें।"},
      {stage:"हार्ट अटैक के बाद पीसीआई", text:"यदि हृदय की पंपिंग क्षमता सामान्य है और कोई अन्य प्रक्रिया योजनाबद्ध नहीं है, तो <b>1 सप्ताह</b> बाद निजी ड्राइविंग संभव है; अन्यथा <b>4 सप्ताह</b> प्रतीक्षा करें।"},
      {stage:"कमर्शियल / पेशेवर चालक", text:"ट्रक, बस, टैक्सी या अन्य कमर्शियल लाइसेंस धारकों को कम से कम <b>6 सप्ताह</b> प्रतीक्षा करनी चाहिए और आमतौर पर स्ट्रेस टेस्ट के साथ कार्डियोलॉजिस्ट की अनुमति आवश्यक है।"}
    ], note:"अपने स्थानीय परिवहन प्राधिकरण के मेडिकल फिटनेस नियमों की भी जांच अवश्य करें।"},
    {key:"flying", title:"हवाई यात्रा", items:[
      {stage:"पहले 48 घंटे", text:"हवाई यात्रा से बचें।"},
      {stage:"छोटी घरेलू उड़ान, सामान्य पीसीआई", text:"यदि आप बिना सीने में दर्द या सांस फूले आराम से चल पा रहे हैं, तो आमतौर पर <b>2–3 दिन</b> बाद यात्रा सुरक्षित है।"},
      {stage:"लंबी / अंतरराष्ट्रीय उड़ान", text:"कम से कम <b>1–2 सप्ताह</b> प्रतीक्षा करें। हर घंटे थोड़ा टहलें, पानी पीते रहें, औ��� रक्त के थक्के के जोखिम को कम करने के लिए कम्प्रेशन स्टॉकिंग्स पर विचार कर��ं।"},
      {stage:"हार्ट अटैक या जटिलताओं के बाद पीसीआई", text:"कम से कम <b>2 सप्ताह</b> (कभी-कभी 4–6 सप्ताह) प्रतीक्षा करें और यात्रा से पहले कार्डियोलॉजिस्ट से स्पष्ट अनुमति लें।"}
    ], note:"अपना डिस्चार्ज सारांश, वर्तमान दवाओं की सूची, और यात्रा/मेडिकल बीमा के दस्तावेज़ साथ रखें।"},
    {key:"sexual", title:"यौन संबंध", items:[
      {stage:"एंजियोप्लास्टी (PCI) के बाद", text:"यदि एक्सेस साइट पर कोई जटिलता न हो, तो सामान्यतः PCI के <b>कुछ दिनों</b> के भीतर यौन संबंध फिर से शुरू किए जा सकते हैं। यदि आपकी प्रक्रिया कलाई (रेडियल एक्सेस) से हुई है, तो आप आमतौर पर उतनी ही जल्दी या उससे भी पहले शुरू कर सकते हैं जितनी जल्दी ग्रोइन (फीमोरल एक्सेस) वाले मरीज़।"},
      {stage:"हार्ट अटैक के बाद", text:"सामान्य हार्ट अटैक के <b>1 सप्ताह या उससे अधिक</b> बाद यौन संबंध फिर से शुरू करना उचित है, जब आपको हल्की-मध्यम शारीरिक गतिविधि के दौरान सीने में दर्द, सांस फूलना या अन्य लक्षण न हों।"},
      {stage:"सामान्य फिटनेस मापदंड", text:"यौन क्रिया हृदय पर हल्के-मध्यम परिश्रम जितना ही भार डालती है — लगभग <b>2 मंज़िल सीढ़ियां</b> तेज़ी से चढ़ने या तेज़ चलने के बराबर। यदि आप बिना सीने में दर्द, सांस फूले, चक्कर या धड़कन अनियमित हुए यह आराम से कर सकें, तो यौन क्रिया आमतौर पर सुरक्षित है।"},
      {stage:"दवाएं — PDE5 इनहिबिटर", text:"PDE5-इनहिबिटर दवाओं (सिल्डेनाफिल, टाडालाफिल, वार्डेनाफिल) को कभी भी नाइट्रेट दवाओं के साथ न लें — इस संयोजन से रक्तचाप में खतरनाक गिरावट हो सकती है। सिल्डेनाफिल या वार्डेनाफिल लेने के बाद <b>24 घंटे</b> तक नाइट्रेट न दें; टाडालाफिल के बाद <b>48 घंटे</b> प्रतीक्षा करें।"},
      {stage:"अपनी हृदय की दवाएं बंद न करें", text:"बीटा-ब्लॉकर और अन्य हृदय दवाएं शायद ही कभी यौन समस्या का असली कारण होती हैं। इस चिंता के कारण अपने हृदय की रक्षा करने वाली दवा खुद बंद या कम न करें — इसके बजाय अपने कार्डियोलॉजिस्ट से चर्चा करें।"},
      {stage:"कब रुकना चाहिए", text:"यदि आपको अस्थिर या बिगड़ता सीने का दर्द, अनियंत्रित हार्ट फेल्योर हो, या यौन क्रिया के दौरान ही सीने में दर्द, तेज़ सांस फूलना या धड़कन अनियमित होना हो, तो जब तक स्थिति स्थिर व समीक्षित न हो जाए, यौन क्रिया टालें।"}
    ], note:"हृदय प्रक्रिया के बाद अंतरंगता फिर से शुरू करने को लेकर चिंता होना मरीज़ और साथी दोनों के लिए सामान्य है। समय और चिंताओं के बारे में अपने कार्डियोलॉजिस्ट या रिहैब टीम से खुलकर बात करना वास्तव में मददगार होता है।"},
    {key:"work", title:"काम पर वापसी", items:[
      {stage:"डेस्क / बैठकर किया जाने वाला काम", text:"स्वस्थ महसूस करने पर आमतौर पर <b>1 सप्ताह</b> बाद।"},
      {stage:"हल्का शारीरिक काम", text:"(खड़े होना, चलना, हल्का सामान उठाना) — आमतौर पर लगभग <b>2 सप्ताह</b> बाद।"},
      {stage:"भारी शारीरिक श्रम", text:"शारीरिक रूप से कठिन कार्यों के लिए <b>4–6 सप्ताह</b> चाहिए, और अक्सर अनुमति से पहले स्ट्रेस टेस्ट आवश्यक होता है।"}
    ], note:"जहां उपलब्ध हो, वहां कार्डियक रिहैबिलिटेशन कार्यक्रम में शामिल होना काम और रोज़मर्रा की गतिविधियों में सुरक्षित व आत्मविश्वास भरी वापसी में मदद करता है।"},
    {key:"gym", title:"जिम और व्यायाम", items:[
      {stage:"दिन 1–2", text:"सहनशक्ति के अनुसार घर के अंदर हल्की सैर करें। पंक्चर वाले हाथ/पैर पर ज़ोर डालने या भारी सामान उठाने से बचें।"},
      {stage:"सप्ताह 1", text:"रोज़ छोटी सैर (10–15 मिनट), धीरे-धीरे बढ़ाते हुए।"},
      {stage:"सप्ताह 2", text:"सैर की अवधि बढ़ाएं; हल्की स्टेशनरी साइकिलिंग करें। एक्सेस साइट पूरी तरह ठीक होने तक तैराकी से बचें।"},
      {stage:"सप्ताह 2–4", text:"यदि नामांकित हैं, तो संरचित कार्डियक रिहैबिलिटेशन व्यायाम कार्यक्रम शुरू करें।"},
      {stage:"सप्ताह 4–6", text:"अपनी रिहैब टीम के मार्गदर्शन में हल्के वज़न के साथ हल्का जिम/रेजिस्टेंस प्रशिक्षण।"},
      {stage:"अनुमति मिलने के बाद", text:"भारी वेटलिफ्टिंग, प्रतिस्पर्धी खेल या तीव्र-तीव्रता वाला प्रशिक्षण केवल कार्डियोलॉजिस्ट की अनुमति के बाद, जो आमतौर पर लगभग 6 सप्ताह में ट्रेडमिल/स्ट्रेस टेस्ट से पुष्ट की जाती है।"}
    ], note:"तीव्र लेकिन छोटे प्रयासों की बजाय नियमित मध्यम गतिविधि ही आपके हृदय की दीर्घकालिक सुरक्षा करती है।"},
    {key:"meds", title:"स्टेंट के बाद दवाएं", items:[
      {stage:"डुअल एंटीप्लेटलेट थेरेपी (DAPT)", text:"एस्पिरिन के साथ P2Y12 इनहिबिटर (टिकाग्रेलोर, प्रासुग्रेल या क्लोपिडोग्रेल) डॉक्टर की सलाह अनुसार लेते रहें — हार्ट अटैक/ACS के बाद लगे स्टेंट के लिए आमतौर पर लगभग <b>12 महीने</b> तक।"},
      {stage:"2025 अपडेट", text:"2025 के ACC/AHA ACS दिशानिर्देश के अनुसार, अधिक ब्लीडिंग जोखिम वाले कुछ मरीज़ों में केवल <b>1 महीने</b> बाद एस्पिरिन बंद कर सिर्फ एक एंटीप्लेटलेट दवा (अक्सर टिकाग्रेलोर) जारी रखी जा सकती है — यह निर्णय आपके कार्डियोलॉजिस्ट द्वारा व्यक्तिगत आधार पर लिया जाता है, खुद से नहीं।"},
      {stage:"खुद से बंद न करें", text:"एंटीप्लेटलेट दवाएं अचानक खुद बंद करने से स्टेंट में रुकावट (स्टेंट थ्रोम्बोसिस) का खतरा काफी बढ़ जाता है, जिससे हार्ट अटैक हो सकता है।"},
      {stage:"किसी अन्य प्रक्रिया से पहले", text:"किसी भी अन्य डॉक्टर, सर्जन या दंत चिकित्सक को बताएं कि आप एंटीप्लेटलेट थेरेपी पर हैं — अपने कार्डियोलॉजिस्ट की विशेष सलाह के बिना इसे किसी प्रक्रिया के लिए बंद न करें।"}
    ], note:"यह भाग 2025 के ACC/AHA/ACEP/NAEMSP/SCAI ACS दिशानिर्देश अपडेट पर आधारित है।"}
  ]
},
pa:{
  dir:"ltr",

  footerSources:"ਹਵਾਲੇ: ESC ਮਾਇਓਕਾਰਡੀਅਲ ਰੀਵੈਸਕੁਲਰਾਈਜ਼ੇਸ਼ਨ ਅਤੇ ਡਰਾਈਵਿੰਗ ਫਿਟਨੈਸ ਦਿਸ਼ਾ-ਨਿਰਦੇਸ਼; ESC ਕ੍ਰੌਨਿਕ ਕੋਰੋਨਰੀ ਸਿੰਡਰੋਮ ਦਿਸ਼ਾ-ਨਿਰਦੇਸ਼ (2024); 2025 ACC/AHA/ACEP/NAEMSP/SCAI ਏਕਿਊਟ ਕੋਰੋਨਰੀ ਸਿੰਡਰੋਮ ਪ੍ਰਬੰਧਨ ਦਿਸ਼ਾ-ਨਿਰਦੇਸ਼; 2021 ACC/AHA/SCAI ਕੋਰੋਨਰੀ ਆਰਟਰੀ ਰੀਵੈਸਕੁਲਰਾਈਜ਼ੇਸ਼ਨ ਦਿਸ਼ਾ-ਨਿਰਦੇਸ਼; Levine GN ਅਤੇ ਹੋਰ, \"Sexual Activity and Cardiovascular Disease: A Scientific Statement From the American Heart Association,\" Circulation 2012;125:1058–1072; ਕਾਰਡੀਓਲੋਜੀਕਲ ਸੋਸਾਇਟੀ ਆਫ਼ ਇੰਡੀਆ ਦੀ ਵਿਹਾਰਕ ਸਲਾਹ। ਸਮੱਗਰੀ ਦੀ ਆਖ਼ਰੀ ਸਮੀਖਿਆ: ਅਗਸਤ 2026।",

    {key:"sexual", title:"ਸਰੀਰਕ ਸੰਬੰਧ", items:[
      {stage:"ਐਂਜੀਓਪਲਾਸਟੀ (PCI) ਤੋਂ ਬਾਅਦ", text:"ਜੇ ਐਕਸੈਸ ਥਾਂ 'ਤੇ ਕੋਈ ਜਟਿਲਤਾ ਨਾ ਹੋਵੇ, ਤਾਂ ਆਮ ਤੌਰ 'ਤੇ PCI ਦੇ <b>ਕੁਝ ਦਿਨਾਂ</b> ਅੰਦਰ ਸਰੀਰਕ ਸੰਬੰਧ ਮੁੜ ਸ਼ੁਰੂ ਕੀਤੇ ਜਾ ਸਕਦੇ ਹਨ। ਜੇ ਤੁਹਾਡੀ ਪ੍ਰਕਿਰਿਆ ਗੁੱਟ (ਰੇਡੀਅਲ ਐਕਸੈਸ) ਰਾਹੀਂ ਹੋਈ ਹੈ, ਤਾਂ ਤੁਸੀਂ ਆਮ ਤੌਰ 'ਤੇ ਗਰੋਇਨ (ਫੀਮੋਰਲ ਐਕਸੈਸ) ਵਾਲੇ ਮਰੀਜ਼ਾਂ ਜਿੰਨੀ ਜਲਦੀ ਜਾਂ ਉਸ ਤੋਂ ਵੀ ਪਹਿਲਾਂ ਸ਼ੁਰੂ ਕਰ ਸਕਦੇ ਹੋ।"},
      {stage:"ਦਿਲ ਦੇ ਦੌਰੇ ਤੋਂ ਬਾਅਦ", text:"ਆਮ ਦਿਲ ਦੇ ਦੌਰੇ ਦੇ <b>1 ਹਫ਼ਤੇ ਜਾਂ ਵਧੇਰੇ</b> ਬਾਅਦ ਸਰੀਰਕ ਸੰਬੰਧ ਮੁੜ ਸ਼ੁਰੂ ਕਰਨਾ ਉਚਿਤ ਹੈ, ਜਦੋਂ ਤੁਹਾਨੂੰ ਹਲਕੀ-ਦਰਮਿਆਨੀ ਸਰੀਰਕ ਗਤੀਵਿਧੀ ਦੌਰਾਨ ਛਾਤੀ ਵਿੱਚ ਦਰਦ, ਸਾਹ ਚੜ੍ਹਨਾ ���ਾਂ ਹੋਰ ਲੱਛਣ ਨਾ ਹੋਣ।"},
      {stage:"ਆਮ ਫਿਟਨੈਸ ਮਾਪਦੰਡ", text:"ਸਰੀਰਕ ਕਿਰਿਆ ਦਿਲ 'ਤੇ ਹਲਕੇ-ਦਰਮਿਆਨੇ ਮਿਹਨਤ ਜਿੰਨਾ ਹੀ ਭਾਰ ਪਾਉਂਦੀ ਹੈ — ਲਗਭਗ <b>2 ਮੰਜ਼ਿਲਾਂ ਪੌੜੀਆਂ</b> ਤੇਜ਼ੀ ਨਾਲ ਚੜ੍ਹਨ ਜਾਂ ਤੇਜ਼ ਤੁਰਨ ਦੇ ਬਰਾਬਰ। ਜੇ ਤੁਸੀਂ ਬਿਨਾਂ ਛਾਤੀ ਦੇ ਦਰਦ, ਸਾਹ ਚੜ੍ਹੇ, ਚੱਕਰ ਜਾਂ ਧੜਕਣ ਅਨਿਯਮਿਤ ਹੋਏ ਇਹ ਆਰਾਮ ਨਾਲ ਕਰ ਸਕੋ, ਤਾਂ ਸਰੀਰਕ ਕਿਰਿਆ ਆਮ ਤੌਰ 'ਤੇ ਸੁਰੱਖਿਅਤ ਹੈ।"},
      {stage:"ਦਵਾਈਆਂ — PDE5 ਇਨਹਿਬਿਟਰ", text:"PDE5-ਇਨਹਿਬਿਟਰ ਦਵਾਈਆਂ (ਸਿਲਡੇਨਾਫ਼ਿਲ, ਟੈਡਾਲਾਫ਼ਿਲ, ਵਾਰਡੇਨਾਫ਼ਿਲ) ਨੂੰ ਕਦੇ ਵੀ ਨਾਈਟ੍ਰੇਟ ਦਵਾਈਆਂ ਨਾਲ ਨਾ ਲਓ — ਇਸ ਮਿਸ਼ਰਣ ਨਾਲ ਬਲੱਡ ਪ੍ਰੈਸ਼ਰ ਵਿੱਚ ਖ਼ਤਰਨਾਕ ਗਿਰਾਵਟ ਆ ਸਕਦੀ ਹੈ। ਸਿਲਡੇਨਾਫ਼ਿਲ ਜਾਂ ਵਾਰਡੇਨਾਫ਼ਿਲ ਲੈਣ ਤੋਂ ਬਾਅਦ <b>24 ਘੰਟੇ</b> ਤੱਕ ਨਾਈਟ੍ਰੇਟ ਨਾ ਦਿਓ; ਟੈਡਾਲਾਫ਼ਿਲ ਤੋਂ ਬਾਅਦ <b>48 ਘੰਟੇ</b> ਉਡੀਕ ਕਰੋ।"},
      {stage:"ਆਪਣੀਆਂ ਦਿਲ ਦੀਆਂ ਦਵਾਈਆਂ ਬੰਦ ਨਾ ਕਰੋ", text:"ਬੀਟਾ-ਬਲੌਕਰ ਅਤੇ ਹੋਰ ਦਿਲ ਦੀਆਂ ਦਵਾਈਆਂ ਸ਼ਾਇਦ ਹੀ ਕਦੇ ਸਰੀਰਕ ਸਮੱਸਿਆ ਦਾ ਅਸਲ ਕਾਰਨ ਹੁੰਦੀਆਂ ਹਨ। ਇਸ ਚਿੰਤਾ ਕਾਰਨ ਆਪਣੇ ਦਿਲ ਦੀ ਰੱਖਿਆ ਕਰਨ ਵਾਲੀ ਦਵਾਈ ਖ਼ੁਦ ਬੰਦ ਜਾਂ ਘੱਟ ਨਾ ਕਰੋ — ਇਸ ਦੀ ਬਜਾਏ ਆਪਣੇ ਕਾਰਡੀਓਲੋਜਿਸਟ ਨਾਲ ਗੱਲ ਕਰੋ।"},
      {stage:"ਕਦੋਂ ਰੁਕਣਾ ਚਾਹੀਦਾ ਹੈ", text:"ਜੇ ਤੁਹਾਨੂੰ ਅਸਥਿਰ ਜਾਂ ਵਿਗੜਦਾ ਛਾਤੀ ਦਾ ਦਰਦ, ਅਨਿਯੰਤਰਿਤ ਦਿਲ ਦੀ ਅਸਫ਼ਲਤਾ ਹੋਵੇ, ਜਾਂ ਸਰੀਰਕ ਕਿਰਿਆ ਦੌਰਾਨ ਹੀ ਛਾਤੀ ਵਿੱਚ ਦਰਦ, ਤੇਜ਼ ਸਾਹ ਚੜ੍ਹਨਾ ਜਾਂ ਧੜਕਣ ਅਨਿਯਮਿਤ ਹੋਣਾ ਹੋਵੇ, ਤਾਂ ਜਦੋਂ ਤੱਕ ਸਥਿਤੀ ਸਮੀਖਿਆ ਅਤੇ ਸਥਿਰ ਨਾ ਹੋ ਜਾਵੇ, ਸਰੀਰਕ ਕਿਰਿਆ ਟਾਲੋ।"}
    ], note:"ਦਿਲ ਦੀ ਪ੍ਰਕਿਰਿਆ ਤੋਂ ਬਾਅਦ ਨੇੜਤਾ ਮੁੜ ਸ਼ੁਰੂ ਕਰਨ ਨੂੰ ਲੈ ਕੇ ਚਿੰਤਾ ਹੋਣਾ ਮਰੀਜ਼ ਅਤੇ ਸਾਥੀ ਦੋਵਾਂ ਲਈ ਆਮ ਹੈ। ਸਮੇਂ ਅਤੇ ਚਿੰਤਾਵਾਂ ਬਾਰੇ ਆਪਣੇ ਕਾਰਡੀਓਲੋਜਿਸਟ ਜਾਂ ਰੀਹੈਬ ਟੀਮ ਨਾਲ ਖੁੱਲ੍ਹ ਕੇ ਗੱਲ ਕਰਨਾ ਸੱਚਮੁੱਚ ਮਦਦਗਾਰ ਹੁੰਦਾ ਹੈ।"},
    {key:"work", title:"ਕੰਮ 'ਤੇ ਵਾਪਸੀ", items:[
      {stage:"ਡੈਸਕ / ਬੈਠ ਕੇ ਕੀਤਾ ਜਾਣ ਵਾਲਾ ਕੰਮ", text:"ਠੀਕ ਮਹਿਸੂਸ ਕਰਨ 'ਤੇ ਆਮ ਤੌਰ 'ਤੇ <b>1 ਹਫ਼ਤੇ</b> ਬਾਅਦ।"},
      {stage:"ਹਲਕਾ ਸਰੀਰਕ ਕੰਮ", text:"(ਖੜ੍ਹੇ ਹੋਣਾ, ਤੁਰਨਾ, ਹਲਕਾ ਸਮਾਨ ਚੁੱਕਣਾ) — ਆਮ ਤੌਰ 'ਤੇ ਲਗਭਗ <b>2 ਹਫ਼ਤੇ</b> ਬਾਅਦ।"},
      {stage:"ਭਾਰੀ ਸਰੀਰਕ ਮਿਹਨਤ", text:"ਸਰੀਰਕ ਤੌਰ 'ਤੇ ਔਖੇ ਕੰਮਾਂ ਲਈ <b>4–6 ਹਫ਼ਤੇ</b> ਚਾਹੀਦੇ ਹਨ, ਅਤੇ ਅਕਸਰ ਮਨਜ਼ੂਰੀ ਤੋਂ ਪਹਿਲਾਂ ਸਟ੍ਰੈੱਸ ਟੈਸਟ ਲੋੜੀਂਦਾ ਹੁੰਦਾ ਹੈ।"}
    ], note:"ਜਿੱਥੇ ਉਪਲਬਧ ਹੋਵੇ, ਕਾਰਡੀਐਕ ਰੀਹੈਬਿਲੀਟੇਸ਼ਨ ਪ੍ਰੋਗਰਾਮ ਵਿੱਚ ਸ਼ਾਮਲ ਹੋਣਾ ਕੰਮ ਅਤੇ ਰੋਜ਼ਾਨਾ ਗਤੀਵਿਧੀਆਂ ਵਿੱਚ ਸੁਰੱਖਿਅਤ ਤੇ ਭਰੋਸੇਮੰਦ ਵਾਪਸੀ ਵਿੱਚ ਮਦਦ ਕਰਦਾ ਹੈ।"},
    {key:"gym", title:"ਜਿਮ ਅਤੇ ਕਸਰਤ", items:[
      {stage:"ਦਿਨ 1–2", text:"ਸਹਿਣਸ਼ੀਲਤਾ ਅਨੁਸਾਰ ਘਰ ਦੇ ਅੰਦਰ ਹਲਕੀ ਸੈਰ ਕਰੋ। ਪੰਕਚਰ ਵਾਲੇ ਹੱਥ/ਪੈਰ 'ਤੇ ਜ਼ੋਰ ਪਾਉਣ ਜਾਂ ਭਾਰੀ ਸਮਾਨ ਚੁੱਕਣ ਤੋਂ ਬਚੋ।"},
      {stage:"ਹਫ਼ਤਾ 1", text:"ਰੋਜ਼ ਛੋਟੀ ਸੈਰ (10–15 ਮਿੰਟ), ਹੌਲੀ-ਹੌਲੀ ਵਧਾਉਂਦੇ ਹੋਏ।"},
      {stage:"ਹਫ਼ਤਾ 2", text:"ਸੈਰ ਦੀ ਮਿਆਦ ਵਧਾਓ; ਹਲਕੀ ਸਟੇਸ਼ਨਰੀ ਸਾਈਕਲਿੰਗ ਕਰੋ। ਐਕਸੈਸ ਥਾਂ ਪੂਰੀ ਤਰ੍ਹਾਂ ਠੀਕ ਹੋਣ ਤੱਕ ਤੈਰਾਕੀ ਤੋਂ ਬਚੋ।"},
      {stage:"ਹਫ਼ਤਾ 2–4", text:"ਜੇ ਦਾਖਲ ਹੋ, ਤਾਂ ਸੰਗਠਿਤ ਕਾਰਡੀਐਕ ਰੀਹੈਬਿਲੀਟੇਸ਼ਨ ਕਸਰਤ ਪ੍ਰੋਗਰਾਮ ਸ਼ੁਰੂ ਕਰੋ।"},
      {stage:"ਹਫ਼ਤਾ 4–6", text:"ਆਪਣੀ ਰੀਹੈਬ ਟੀਮ ਦੀ ਅਗਵਾਈ ਵਿੱਚ ਹਲਕੇ ਭਾਰ ਨਾਲ ਹਲਕੀ ਜਿਮ/ਰੈਜ਼ਿਸਟੈਂਸ ਸਿਖਲਾਈ।"},
      {stage:"ਮਨਜ਼ੂਰੀ ਤੋਂ ਬਾਅਦ", text:"ਭਾਰੀ ਵੇਟਲਿਫਟਿੰਗ, ਮੁਕਾਬਲੇ ਵਾਲੀ ਖੇਡ ਜਾਂ ਤੀਬਰ ਸਿਖਲਾਈ ਸਿਰਫ਼ ਕਾਰਡੀਓਲੋਜਿਸਟ ਦੀ ਮਨਜ਼ੂਰੀ ਤੋਂ ਬਾਅਦ, ਜੋ ਆਮ ਤੌਰ 'ਤੇ ਲਗਭਗ 6 ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਟ੍ਰੈਡਮਿਲ/ਸਟ੍ਰੈੱਸ ਟੈਸਟ ਨਾਲ ਪੁਸ਼ਟੀ ਕੀਤੀ ਜਾਂਦੀ ਹੈ।"}

    {key:"meds", title:"ਸਟੈਂਟ ਤੋਂ ਬਾਅਦ ਦਵਾਈਆਂ", items:[
      {stage:"ਡਿਊਲ ਐਂਟੀਪਲੇਟਲੈੱਟ ਥੈਰੇਪੀ (DAPT)", text:"ਐਸਪਰੀਨ ਦੇ ਨਾਲ P2Y12 ਇਨਹਿਬਿਟਰ (ਟਿਕਾਗ੍ਰੇਲਰ, ਪ੍ਰਾਸੁਗ੍ਰੇਲ ਜਾਂ ਕਲੋਪੀਡੋਗ੍ਰੇਲ) ਡਾਕਟਰ ਦੀ ਸਲਾਹ ਅਨੁਸਾਰ ਲੈਂਦੇ ਰਹੋ — ਦਿਲ ਦੇ ਦੌਰੇ/ACS ਤੋਂ ਬਾਅਦ ਲੱਗੇ ਸਟੈਂਟ ਲਈ ਆਮ ਤੌਰ 'ਤੇ ਲਗਭਗ <b>12 ਮਹੀਨੇ</b> ਤੱਕ।"},
      {stage:"2025 ਅੱਪਡੇਟ", text:"2025 ਦੇ ACC/AHA ACS ਦਿਸ਼ਾ-ਨਿਰਦੇਸ਼ ਅਨੁਸਾਰ, ਵਧੇਰੇ ਖੂਨ ਵਹਿਣ ਦੇ ਖ਼ਤਰੇ ਵਾਲੇ ਕੁਝ ਮਰੀਜ਼ਾਂ ਵਿੱਚ ਸਿਰਫ਼ <b>1 ਮਹੀਨੇ</b> ਬਾਅਦ ਐਸਪਰੀਨ ਬੰਦ ਕਰਕੇ ਸਿਰਫ਼ ਇੱਕ ਐਂਟੀਪਲੇਟਲੈੱਟ ਦਵਾਈ (ਅਕਸਰ ਟਿਕਾਗ੍ਰੇਲਰ) ਜਾਰੀ ਰੱਖੀ ਜਾ ਸਕਦੀ ਹੈ — ਇਹ ਫ਼ੈਸਲਾ ਤੁਹਾਡੇ ਕਾਰਡੀਓਲੋਜਿਸਟ ਦੁਆਰਾ ਨਿੱਜੀ ਆਧਾਰ 'ਤੇ ਲਿਆ ਜਾਂਦਾ ਹੈ, ਖ਼ੁਦ ਤੋਂ ਨਹੀਂ।"},
      {stage:"ਖ਼ੁਦ ਬੰਦ ਨਾ ਕਰੋ", text:"ਐਂਟੀਪਲੇਟਲੈੱਟ ਦਵਾਈਆਂ ਅਚਾਨਕ ਖ਼ੁਦ ਬੰਦ ਕਰਨ ਨਾਲ ਸਟੈਂਟ ਵਿੱਚ ਰੁਕਾਵਟ (ਸਟੈਂਟ ਥ੍ਰੌਂਬੋਸਿਸ) ਦਾ ਖ਼ਤਰਾ ਕਾਫ਼ੀ ਵੱਧ ਜਾਂਦਾ ਹੈ, ਜਿਸ ਨਾਲ ਦਿਲ ਦਾ ਦੌਰਾ ਪੈ ਸਕਦਾ ਹੈ।"},
      {stage:"ਕਿਸੇ ਹੋਰ ਪ੍ਰਕਿਰਿਆ ਤੋਂ ਪਹਿਲਾਂ", text:"ਕਿਸੇ ਵੀ ਹੋਰ ਡਾਕਟਰ, ਸਰਜਨ ਜਾਂ ਦੰਦਾਂ ਦੇ ਡਾਕਟਰ ਨੂੰ ਦੱਸੋ ਕਿ ਤੁਸੀਂ ਐਂਟੀਪਲੇਟਲੈੱਟ ਥੈਰੇਪੀ 'ਤੇ ਹੋ — ਆਪਣੇ ਕ���ਰਡੀਓਲੋਜਿਸਟ ਦੀ ਖ਼ਾਸ ਸਲਾਹ ਤੋਂ ਬਿਨਾਂ ਇਸਨੂੰ ਕਿਸੇ ਪ੍ਰਕਿਰਿਆ ਲਈ ਬੰਦ ਨਾ ਕਰੋ।"}

let currentLang = "en";

function renderSections(lang){
  const d = DATA[lang];
  const wrap = document.getElementById("sections");
  wrap.innerHTML = "";
  d.sections.forEach((sec, i)=>{
    const card = document.createElement("div");
    card.className = "card" + (i===0 ? " open":"");
    card.innerHTML = `
      <div class="card-head" data-idx="${i}">
        <div class="card-icon">${ICONS[sec.key]}</div>
        <div class="card-title">${sec.title}</div>
        <svg class="card-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          ${sec.items.map(it=>`
            <div class="stage-row">
              <div class="stage-label">${it.stage}</div>
              <div class="stage-text">${it.text}</div>
            </div>
          `).join("")}
          ${sec.note ? `<div class="note-chip">${sec.note}</div>` : ""}
        </div>
      </div>
    `;
    card.querySelector(".card-head").addEventListener("click", ()=>{
      card.classList.toggle("open");
    });
    wrap.appendChild(card);
  });
}

  document.getElementById("chatHeadTitle").textContent = d.chatHeadTitle;
  document.getElementById("chatHeadSub").textContent = d.chatHeadSub;
  document.getElementById("chatInput").placeholder = d.chatInputPlaceholder;
  document.getElementById("chatSend").textContent = d.chatSend;
  document.getElementById("chatDisclaimer").textContent = d.chatDisclaimer;
  document.getElementById("footerNote").textContent = d.footerNote;
  document.getElementById("footerSources").textContent = d.footerSources;

  const pulseWrap = document.getElementById("pulseStages");
  pulseWrap.innerHTML = d.stageAxis.map(s=>`<div class="pulse-stage"><div class="dot"></div>${s}</div>`).join("");

  document.querySelectorAll(".langswitch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === lang);
  });
}

function setLang(lang){
  currentLang = lang;
  renderStaticText(lang);
  renderSections(lang);
  resetChat();
}

document.getElementById("langswitch").addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-lang]");
  if(!btn) return;
  setLang(btn.dataset.lang);
});

/* =========================================================
   CHATBOT — grounded on this guide's content
   Default LLM: Grok (x-ai/grok-4.5), served free of charge and
   without any API key via the Puter.js browser SDK, so this
   static page never needs a server-side secret.
   Also includes a free, built-in voice-over (Web Speech API
   speechSynthesis) that reads bot replies aloud.
   ========================================================= */
const CHAT_MODEL = "x-ai/grok-4.5";

const chatFab = document.getElementById("chatFab");
const chatPanel = document.getElementById("chatPanel");
const chatBody = document.getElementById("chatBody");
const chatInput = document.getElementById("chatInput");
const chatSend = document.getElementById("chatSend");
const voiceToggle = document.getElementById("voiceToggle");

let chatHistory = []; // {role, content}

/* ---- Voice-over (free, browser-native text-to-speech) ---- */
const SPEECH_LANG = {en:"en-US", hi:"hi-IN", pa:"pa-IN", bn:"bn-IN"};
let voiceEnabled = localStorage.getItem("ptcaVoiceEnabled") !== "off";

function updateVoiceToggle(){
  voiceToggle.classList.toggle("muted", !voiceEnabled);
  voiceToggle.setAttribute("aria-pressed", String(voiceEnabled));
}
updateVoiceToggle();

function speak(text){
  if(!voiceEnabled || !("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = SPEECH_LANG[currentLang] || "en-US";
    window.speechSynthesis.speak(utter);
  }catch(err){ /* speech synthesis unsupported/blocked — fail silently */ }
}

voiceToggle.addEventListener("click", ()=>{
  voiceEnabled = !voiceEnabled;
  localStorage.setItem("ptcaVoiceEnabled", voiceEnabled ? "on" : "off");
  updateVoiceToggle();
  if(!voiceEnabled && "speechSynthesis" in window) window.speechSynthesis.cancel();
});

function resetChat(){
  chatHistory = [];
  chatBody.innerHTML = "";
  addMsg("bot", DATA[currentLang].chatIntro);
}

function addMsg(role, text){
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  chatBody.appendChild(el);
  chatBody.scrollTop = chatBody.scrollHeight;
  if(role === "bot" && chatPanel.classList.contains("open")) speak(text);
  return el;
}

chatFab.addEventListener("click", ()=>{
  chatPanel.classList.add("open");
  chatFab.style.display = "none";
  if(chatBody.children.length === 0) resetChat();
});
document.getElementById("chatClose").addEventListener("click", ()=>{
  chatPanel.classList.remove("open");
  chatFab.style.display = "flex";
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
});

function buildSystemPrompt(lang){
  const d = DATA[lang];
  const langNames = {en:"English", hi:"Hindi", pa:"Punjabi", bn:"Bengali"};
  let guideText = d.sections.map(sec=>{
    const items = sec.items.map(it=>`- ${it.stage}: ${it.text.replace(/<\/?b>/g,"")}`).join("\n");
    return `## ${sec.title}\n${items}\n${sec.note ? "Note: "+sec.note : ""}`;
  }).join("\n\n");

  return `You are a warm, careful patient-education assistant embedded inside a "Post-PTCA (angioplasty) Recovery Guide" web app for a cardiology clinic. A patient who has recently had coronary angioplasty/stenting is asking you questions.

Answer ONLY using the guideline content below (based on ESC, ACC/AHA and Indian cardiology society practice recommendations), which is also shown to the patient elsewhere in this app. Keep answers short (2-5 sentences), warm, and practical. Always answer in ${langNames[lang]}, using simple everyday language a patient can understand.

If the patient describes symptoms such as chest pain, severe breathlessness, fainting, palpitations, or heavy bleeding/swelling at the puncture site, tell them clearly to seek emergency medical care immediately, before anything else.

If a question needs personal medical judgement (their specific ejection fraction, medications, complication history, exact clearance date), give the general guidance from below but clearly recommend they confirm the specific timing with their own treating cardiologist.

Do not answer questions unrelated to post-angioplasty recovery and lifestyle; gently redirect to the topic of this guide.

GUIDELINE CONTENT:
${guideText}`;
}

async function sendMessage(){
  const text = chatInput.value.trim();
  if(!text) return;
  chatInput.value = "";
  chatSend.disabled = true;
  addMsg("user", text);
  chatHistory.push({role:"user", content:text});

  const typingEl = addMsg("typing", currentLang==="hi" ? "लिख रहा हूं…" : currentLang==="pa" ? "ਲਿਖ ਰਿਹਾ ਹਾਂ…" : currentLang==="bn" ? "লিখছি…" : "Typing…");
  typingEl.classList.add("typing");

  try{
    if(typeof puter === "undefined" || !puter.ai || typeof puter.ai.chat !== "function"){
      throw new Error("Chat assistant is unavailable right now.");
    }
    const messages = [
      {role:"system", content: buildSystemPrompt(currentLang)},
      ...chatHistory
    ];
    const response = await puter.ai.chat(messages, {model: CHAT_MODEL});
    const reply = (response && response.message && response.message.content
      ? String(response.message.content)
      : typeof response === "string" ? response : "").trim()
      || "Sorry, I couldn't process that. Please try again.";
    typingEl.remove();
    addMsg("bot", reply);
    chatHistory.push({role:"assistant", content:reply});
  }catch(err){
    typingEl.remove();
    addMsg("bot", "Sorry, something went wrong reaching the assistant. Please try again in a moment.");
  }finally{
    chatSend.disabled = false;
  }
}

chatSend.addEventListener("click", sendMessage);
chatInput.addEventListener("keydown", (e)=>{
  if(e.key === "Enter") sendMessage();
});

setLang("en");
</script>
</body>
</html>
